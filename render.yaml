services:
  - type: web
    name: janison-assessment-backend
    runtime: docker
    plan: starter

    # Docker build settings
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Health check configuration (Render automatically tests this endpoint)
    healthCheckPath: /api/health

    # Environment variables
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 5000
